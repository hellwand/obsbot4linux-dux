name: Release

# Pushing a tag vX.Y.Z creates the GitHub release and marks the commit released. Before it does,
# verify checks that the tag equals the version in plugin.json, that the tagged commit is on
# develop or on a release/* branch, that it was green as a pull request
# (scripts/release-green.sh) and that CHANGELOG.md has a section for the version. If a check
# fails, nothing is created. The release notes are that CHANGELOG section.
# After the release exists, mark-released adds the check run "released" to the tagged commit.
# main requires it: main can only be fast-forwarded to a commit that a tag run released (README,
# "Releasing"). No job here pushes a branch.
# workflow_dispatch is a dry run of the same checks on `sha` (default: the head of the ref) and
# `version`: it prints the release and creates nothing, and it never reports "released" (no job
# of this file is named "released": a skipped job would count as a passed check).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      sha:
        description: "Dry run: the commit to check (default: the head of the ref). Creates nothing."
        required: false
        type: string
      version:
        description: "Dry run: the version to check, X.Y.Z without v."
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read # the run behind the required check
      checks: read # the required check run
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The scripts run from this checkout and are given the commit and the tag to check: a dry
      # run's commit can be older than the scripts.
      - env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.sha || github.sha }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
        run: |
          sha=$(git rev-parse --verify --quiet "$SHA^{commit}") || {
            echo "release refused: $SHA is not a commit" >&2
            exit 1
          }
          on=
          for branch in $(git for-each-ref --format='%(refname)' refs/remotes/origin/develop 'refs/remotes/origin/release/*'); do
            if git merge-base --is-ancestor "$sha" "$branch"; then
              on=${branch#refs/remotes/origin/}
              break
            fi
          done
          [ -n "$on" ] || {
            echo "release refused: $sha is not on develop or on a release/* branch" >&2
            exit 1
          }
          scripts/release-green.sh "$sha"
          scripts/release-notes.sh "$sha" "$TAG" > notes.md
          if git merge-base --is-ancestor origin/main "$sha"; then
            move="main can then be fast-forwarded to $sha"
          else
            move="main stays at $(git rev-parse origin/main): $sha does not contain it (a fix of an older line)"
          fi
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            if git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null ||
              gh release view "$TAG" >/dev/null 2>&1; then
              echo "Dry run: the tag or a release $TAG already exists; a tag push would not create anything new. The checks passed for $sha (on $on); nothing created. Notes it would have:"
            else
              echo "Dry run: would create release $TAG on $sha (on $on), nothing created; $move. Notes:"
            fi
          else
            echo "Checks passed: release $TAG on $sha (on $on); $move. Notes:"
          fi
          cat notes.md

  # Tags only, and only after verify passed. Creates the release.
  release:
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/release-notes.sh "$GITHUB_SHA" "$GITHUB_REF_NAME" > notes.md
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" \
            --notes-file notes.md

  # Tags only, after the release exists: the check run "released" on the tagged commit, which
  # main's ruleset requires. Created through the API so that no job of this file is named
  # "released" (a dry run must never leave one, not even a skipped one).
  mark-released:
    if: github.event_name == 'push' && needs.release.result == 'success'
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      checks: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --json isDraft,tagName \
            --jq 'select(.isDraft == false) | .tagName' | grep -qx "$GITHUB_REF_NAME" || {
            echo "not marked: release $GITHUB_REF_NAME is missing or a draft" >&2
            exit 1
          }
          gh api -X POST "repos/$GITHUB_REPOSITORY/check-runs" \
            -f name=released -f head_sha="$GITHUB_SHA" -f status=completed -f conclusion=success \
            -f "output[title]=Released as $GITHUB_REF_NAME" \
            -f "output[summary]=The tag run created release $GITHUB_REF_NAME for this commit." \
            --jq '"check run \(.id) released on \(.head_sha), app \(.app.slug) \(.app.id)"'
          echo "Move main (maintainer): git push origin $GITHUB_SHA:refs/heads/main"
